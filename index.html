    <script>
      (function() {
        try {
          var gs = localStorage.getItem('taskrooz_global_settings');
          var fontOpt = null;
          if (gs) {
            try { var parsed = JSON.parse(gs); fontOpt = parsed.enforcedFontOption; } catch(e){}
          }
          if (fontOpt && fontOpt.family) {
            var rawFirst = fontOpt.family.replace(/['"]/g, '').split(',')[0].trim();
            if (rawFirst) {
              var comp = "'" + rawFirst + "', 'Vazirmatn', -apple-system, sans-serif";
              document.documentElement.style.setProperty('--font-sans', comp);
              var st = document.createElement('style');
              st.id = 'taskrooz-early-font';
              st.textContent = ":root { --font-sans: " + comp + " !important; } *, body { font-family: " + comp + " !important; }";
              document.head.appendChild(st);
            }
          }
        } catch(e){}
      })();
    </script>
