<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بگ تایم - دستیار روزانه</title>
  <style>
    body {
      width: 320px;
      font-family: Vazirmatn, IRANSans, system-ui, sans-serif;
      margin: 0;
      padding: 12px;
      background: #f8fafc;
      color: #0f172a;
      direction: rtl;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
    }
    .title {
      font-size: 13px;
      font-weight: 800;
      color: #1e1b4b;
    }
    .quick-input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-family: inherit;
      font-size: 12px;
      margin-bottom: 8px;
      outline: none;
    }
    .quick-input:focus {
      border-color: #4f46e5;
    }
    .btn {
      width: 100%;
      padding: 7px;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-weight: bold;
      font-size: 12px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      margin-bottom: 10px;
    }
    .btn:hover {
      background: #4338ca;
    }
    .tasks-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 180px;
      overflow-y: auto;
    }
    .task-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 11px;
    }
    .task-item.done {
      text-decoration: line-through;
      color: #94a3b8;
    }
    .open-home {
      display: block;
      text-align: center;
      margin-top: 10px;
      font-size: 11px;
      color: #4f46e5;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">⚡ دستیار سریع بگ تایم</span>
    <span id="dateBadge" style="font-size: 10px; color: #64748b;">امروز</span>
  </div>
  <form id="popupForm">
    <input type="text" id="popupInput" class="quick-input" placeholder="افزودن سریع تسک..." required />
    <button type="submit" class="btn">+ ثبت تسک جدید</button>
  </form>
  <div id="popupTasks" class="tasks-list">
    <!-- Populated by popup.js -->
  </div>
  <a href="#" id="openNewTab" class="open-home">باز کردن صفحه کامل دستیار ↗</a>

  <script src="popup.js"></script>
</body>
</html>
