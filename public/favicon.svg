<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f6fa" />
    </linearGradient>
    <linearGradient id="hexTopGrad" x1="120" y1="120" x2="392" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#2979FF" />
    </linearGradient>
    <linearGradient id="hexLeftGrad" x1="120" y1="240" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B884" />
    </linearGradient>
    <linearGradient id="hexRightGrad" x1="256" y1="260" x2="392" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#F4511E" />
    </linearGradient>
    <filter id="cubeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="125" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-opacity="0.9" />

  <!-- 3D Isometric Cube -->
  <g filter="url(#cubeShadow)">
    <!-- Top Face (Blue) -->
    <path d="M256 96 L392 176 L256 256 L120 176 Z" fill="url(#hexTopGrad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Bottom-Left Face (Green) -->
    <path d="M120 176 L256 256 L256 416 L120 336 Z" fill="url(#hexLeftGrad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Bottom-Right Face (Orange) -->
    <path d="M256 256 L392 176 L392 336 L256 416 Z" fill="url(#hexRightGrad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Center Concentric Circle Target -->
    <circle cx="256" cy="256" r="46" fill="#0f172a" />
    <circle cx="256" cy="256" r="26" fill="#00E676" />
    <circle cx="256" cy="256" r="14" fill="#0f172a" />
  </g>
</svg>
